ext.version=${project.version}
composerTool.config=Acme Standards Lookup
composerTool.name=Function name
composerTool.name.desc=The function name the model sees. Letters, digits, underscore and dash only. The skill text must use the same name.
composerTool.name.invalid=Use letters, digits, underscore or dash (maximum 64 characters).
composerTool.description=Function description
composerTool.description.desc=Tells the model when to call the tool. Leave empty to use the built-in text.
composerTool.override=Override standards (JSON)
composerTool.override.desc=Optional. Same shape as the bundled file: an object of topics, for example {"departments":{"options":[{"value":"legal","label":"Hukum"}]}}. A topic given here replaces the bundled topic of the same name.
